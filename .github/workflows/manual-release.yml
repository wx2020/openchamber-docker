name: Manual stable release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: official-stable-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare official-stable
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate source branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow from main, got $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Fetch official-stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git ls-remote --exit-code --heads origin official-stable >/dev/null 2>&1; then
            git fetch origin official-stable:refs/remotes/origin/official-stable
          fi

      - name: Select upstream version
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=''
          upstream_ref=''
          source=''
          if git show-ref --verify --quiet refs/remotes/origin/official-stable && \
             git cat-file -e origin/official-stable:VERSION 2>/dev/null; then
            stored_version="$(git show origin/official-stable:VERSION | tr -d '[:space:]')"
            if [[ "$stored_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              version="$stored_version"
              upstream_ref="v$version"
              source='official-stable VERSION'
            fi
          fi

          if [[ -z "$version" ]]; then
            latest_ref="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              '/repos/openchamber/openchamber/releases/latest' \
              --jq '.tag_name')"
            if ! [[ "$latest_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Latest upstream release is not a supported stable tag: $latest_ref" >&2
              exit 1
            fi
            version="${latest_ref#v}"
            upstream_ref="$latest_ref"
            source='latest upstream release'
          else
            if ! gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/openchamber/openchamber/releases/tags/$upstream_ref" \
              --jq '.tag_name' >/dev/null; then
              echo "Stored upstream release $upstream_ref was not found" >&2
              exit 1
            fi
          fi
          echo "Using $version from $source ($upstream_ref)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream_ref=$upstream_ref" >> "$GITHUB_OUTPUT"

      - name: Merge main into official-stable
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/official-stable; then
            git switch --create official-stable --track origin/official-stable
            if ! git merge --no-ff --no-edit origin/main; then
              conflict_files="$(git diff --name-only --diff-filter=U)"
              if [[ "$conflict_files" != "VERSION" ]]; then
                git merge --abort
                echo "Cannot merge main into official-stable without resolving non-VERSION conflicts" >&2
                exit 1
              fi
              git checkout --ours -- VERSION
              git add VERSION
              git commit --no-edit
            fi
          else
            git switch --create official-stable origin/main
          fi

          if [[ ! -f VERSION ]] || [[ "$(tr -d '[:space:]' < VERSION)" != "$VERSION" ]]; then
            printf '%s\n' "$VERSION" > VERSION
            git add VERSION
            git commit -m "chore: set OpenChamber $VERSION"
          fi

          git push origin official-stable

      - name: Start release build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          UPSTREAM_REF: ${{ steps.upstream.outputs.upstream_ref }}
        run: gh workflow run release.yml --ref official-stable -f version="$VERSION" -f upstream_ref="$UPSTREAM_REF"
