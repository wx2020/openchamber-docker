name: Release

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and ancestry
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a plain semantic version, got: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          git fetch origin main --tags --force
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The release tag must point to a commit on origin/main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: openchamber-release:${{ steps.version.outputs.version }}
          build-args: |
            OPENCHAMBER_REF=${{ github.ref_name }}
            OPENCHAMBER_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Smoke test release image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint sh \
            "openchamber-release:${{ steps.version.outputs.version }}" \
            -ceu 'test -f /home/openchamber/openchamber-entrypoint.sh && \
                  test -d /home/openchamber/packages/web/dist && \
                  test -x /usr/local/bin/cloudflared'

  ghcr:
    name: Publish GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCHAMBER_REF=${{ github.ref_name }}
            OPENCHAMBER_VERSION=${{ needs.build.outputs.version }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

  release:
    name: GitHub Release
    needs: [build, ghcr]
    if: needs.build.result == 'success' && needs.ghcr.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            OpenChamber upstream: https://github.com/openchamber/openchamber/releases/tag/${{ github.ref_name }}

            Published image (linux/amd64 only):
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
