name: Release

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      upstream_ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      upstream_ref:
        description: Upstream release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      upstream_ref: ${{ steps.version.outputs.upstream_ref }}
      opencode_version: ${{ steps.opencode.outputs.opencode_version }}
      opencode_package: ${{ steps.opencode.outputs.package }}
      hcloud_version: ${{ steps.image.outputs.hcloud_version }}
      android_cmdline_version: ${{ steps.tools.outputs.android_cmdline_version }}
      android_build_tools_version: ${{ steps.tools.outputs.android_build_tools_version }}
      android_platform_version: ${{ steps.tools.outputs.android_platform_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and ancestry
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          UPSTREAM_REF_INPUT: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          version="$VERSION_INPUT"
          if [[ -z "$version" ]]; then
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          upstream_ref="$UPSTREAM_REF_INPUT"
          if [[ -z "$upstream_ref" ]]; then
            upstream_ref="$GITHUB_REF_NAME"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a plain semantic version, got: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          if ! [[ "$upstream_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Upstream ref must be a stable release tag, got: $upstream_ref" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            git fetch origin main --tags --force
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "The release tag must point to a commit on origin/main" >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF_NAME" != "official-stable" ]]; then
              echo "Dispatched releases must build from official-stable" >&2
              exit 1
            fi
            branch_version="$(tr -d '[:space:]' < VERSION)"
            if [[ "$branch_version" != "$version" ]]; then
              echo "VERSION $branch_version does not match requested version $version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream_ref=$upstream_ref" >> "$GITHUB_OUTPUT"

      - name: Resolve OpenCode CLI package and version
        id: opencode
        shell: bash
        env:
          OPENCHAMBER_VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM_REF: ${{ steps.version.outputs.upstream_ref }}
        run: |
          set -euo pipefail
          oc_major="${OPENCHAMBER_VERSION%%.*}"
          if [ "${oc_major}" -ge 2 ]; then pkg="@opencode/cli"; else pkg="opencode-ai"; fi
          # Trust the upstream Dockerfile pin when present so the bundled server
          # matches the @opencode/client the image is built from.
          pin="$(curl -fsSL "https://raw.githubusercontent.com/openchamber/openchamber/${UPSTREAM_REF}/Dockerfile" \
            | grep -Eo '@opencode/cli@[0-9][0-9A-Za-z.+-]*' | head -n1 | cut -d@ -f3 || true)"
          if [ "${pkg}" = "@opencode/cli" ] && [ -n "${pin}" ]; then
            ver="${pin}"
          else
            ver="$(npm show "${pkg}" version)"
          fi
          npm show "${pkg}@${ver}" version >/dev/null
          if [ "${oc_major}" -ge 2 ]; then
            # Upstream floor: MINIMUM_OPENCODE_VERSION in openchamber/openchamber
            # packages/web/server/lib/opencode/compatibility.js; major must stay 2.
            if [ "${ver%%.*}" != "2" ] || \
               [ "$(printf '2.0.20\n%s\n' "${ver}" | sort -V | head -n1)" != "2.0.20" ]; then
              echo "OpenChamber ${OPENCHAMBER_VERSION} requires OpenCode 2.x >= 2.0.20, resolved ${pkg}@${ver}" >&2
              exit 1
            fi
          fi
          echo "package=${pkg}" >> "$GITHUB_OUTPUT"
          echo "opencode_version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Resolved OpenCode CLI: ${pkg}@${ver} for OpenChamber ${OPENCHAMBER_VERSION}"

      # Android SDK versions are pinned in the Dockerfile; hcloud follows
      # /cli/latest/, so its version is read back out of the built image instead.
      - name: Resolve bundled tool versions
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          read_arg() {
            local value
            value="$(sed -nE "s/^ARG $1=([0-9][0-9A-Za-z.]*)$/\1/p" Dockerfile | head -n1)"
            if [ -z "${value}" ]; then
              echo "Dockerfile has no ARG $1=<version> default" >&2
              exit 1
            fi
            printf '%s' "${value}"
          }
          android_cmdline="$(read_arg ANDROID_CMDLINE_VERSION)"
          android_build_tools="$(read_arg ANDROID_BUILD_TOOLS_VERSION)"
          android_platform="$(read_arg ANDROID_PLATFORM_VERSION)"
          {
            echo "android_cmdline_version=${android_cmdline}"
            echo "android_build_tools_version=${android_build_tools}"
            echo "android_platform_version=${android_platform}"
          } >> "$GITHUB_OUTPUT"
          echo "Android cmdline ${android_cmdline}, build-tools ${android_build_tools}, platform ${android_platform}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: openchamber-release:${{ steps.version.outputs.version }}
          build-args: |
            OPENCHAMBER_REF=${{ steps.version.outputs.upstream_ref }}
            OPENCHAMBER_VERSION=${{ steps.version.outputs.version }}
            OPENCODE_PACKAGE=${{ steps.opencode.outputs.package }}
            OPENCODE_VERSION=${{ steps.opencode.outputs.opencode_version }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Smoke test release image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          out="$(docker run --rm --platform linux/amd64 --entrypoint sh \
            "openchamber-release:${{ steps.version.outputs.version }}" \
            -ceu 'test -f /home/openchamber/openchamber-entrypoint.sh && \
                  test -d /home/openchamber/packages/web/dist && \
                  test -x /usr/local/bin/cloudflared && \
                  command -v hcloud >/dev/null && \
                  test -s /home/openchamber/.hcloud-version && \
                  opencode --version >/dev/null 2>&1 && \
                  echo "bundled opencode runs: ${{ steps.opencode.outputs.package }}@${{ steps.opencode.outputs.opencode_version }}" && \
                  cat /home/openchamber/.hcloud-version')"
          echo "${out}"
          hcloud="$(printf '%s\n' "${out}" | sed -nE 's/^([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | head -n1)"
          if [ -z "${hcloud}" ]; then
            echo "Could not read the bundled KooCLI version from the image" >&2
            exit 1
          fi
          echo "hcloud_version=${hcloud}" >> "$GITHUB_OUTPUT"
          echo "Bundled KooCLI: hcloud ${hcloud}"

  ghcr:
    name: Publish GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,value=v${{ needs.build.outputs.version }},pattern={{version}}
            type=semver,value=v${{ needs.build.outputs.version }},pattern={{major}}.{{minor}}
            type=semver,value=v${{ needs.build.outputs.version }},pattern={{major}}
            type=raw,value=latest

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCHAMBER_REF=${{ needs.build.outputs.upstream_ref }}
            OPENCHAMBER_VERSION=${{ needs.build.outputs.version }}
            OPENCODE_PACKAGE=${{ needs.build.outputs.opencode_package }}
            OPENCODE_VERSION=${{ needs.build.outputs.opencode_version }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

  release:
    name: GitHub Release
    needs: [build, ghcr]
    if: needs.build.result == 'success' && needs.ghcr.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            OpenChamber upstream: https://github.com/openchamber/openchamber/releases/tag/${{ needs.build.outputs.upstream_ref }}

            ## What's Changed
            * OpenChamber ${{ needs.build.outputs.upstream_ref }} packaged image, see the upstream release notes linked above by @openchamber

            ## Feature
            * Bundled Huawei Cloud KooCLI (`hcloud`) ${{ needs.build.outputs.hcloud_version }} for DNS and other cloud service operations

            ## Bugfix
            * Dropped `generate_release_notes`, which duplicated this body
            * Release notes now read bundled tool versions from the Dockerfile ARGs instead of hardcoded strings

            **Bundled OpenCode CLI:** ${{ needs.build.outputs.opencode_package }}@${{ needs.build.outputs.opencode_version }}

            **Runtime environments:**
            - Node.js: v24.19.0
            - Python: 3.13.15
            - Go: 1.25.14
            - Rust: 1.98.0
            - Java: JDK 17 (Temurin)
            - .NET: SDK 8.0
            - Android SDK: cmdline-tools ${{ needs.build.outputs.android_cmdline_version }}, build-tools ${{ needs.build.outputs.android_build_tools_version }}, platform ${{ needs.build.outputs.android_platform_version }}
            - Gradle: 8.11.1
            - Huawei Cloud KooCLI (hcloud): ${{ needs.build.outputs.hcloud_version }}
            <small>hcloud follows Huawei Cloud's `latest` build channel, so this is the version the image actually shipped with; it can change between releases without an OpenChamber bump.</small>

            Published image (linux/amd64 only):
            ghcr.io/${{ github.repository }}:v${{ needs.build.outputs.version }}
