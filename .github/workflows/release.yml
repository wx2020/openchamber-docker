name: Release

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      upstream_ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      upstream_ref:
        description: Upstream release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      upstream_ref: ${{ steps.version.outputs.upstream_ref }}
      opencode_version: ${{ steps.opencode.outputs.opencode_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and ancestry
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          UPSTREAM_REF_INPUT: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          version="$VERSION_INPUT"
          if [[ -z "$version" ]]; then
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          upstream_ref="$UPSTREAM_REF_INPUT"
          if [[ -z "$upstream_ref" ]]; then
            upstream_ref="$GITHUB_REF_NAME"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a plain semantic version, got: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          git fetch origin main --tags --force
          if ! [[ "$upstream_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Upstream ref must be a stable release tag, got: $upstream_ref" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "The release tag must point to a commit on origin/main" >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && ! git merge-base --is-ancestor "refs/tags/v$version" origin/main; then
            echo "The dispatched release tag must point to a commit on origin/main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream_ref=$upstream_ref" >> "$GITHUB_OUTPUT"

      - name: Get opencode-ai version
        id: opencode
        run: |
          version="$(npm show opencode-ai version)"
          echo "opencode_version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: openchamber-release:${{ steps.version.outputs.version }}
          build-args: |
            OPENCHAMBER_REF=${{ steps.version.outputs.upstream_ref }}
            OPENCHAMBER_VERSION=${{ steps.version.outputs.version }}
            OPENCODE_VERSION=${{ steps.opencode.outputs.opencode_version }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Smoke test release image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint sh \
            "openchamber-release:${{ steps.version.outputs.version }}" \
            -ceu 'test -f /home/openchamber/openchamber-entrypoint.sh && \
                  test -d /home/openchamber/packages/web/dist && \
                  test -x /usr/local/bin/cloudflared'

  ghcr:
    name: Publish GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,value=v${{ needs.build.outputs.version }},pattern={{version}}
            type=semver,value=v${{ needs.build.outputs.version }},pattern={{major}}.{{minor}}
            type=semver,value=v${{ needs.build.outputs.version }},pattern={{major}}
            type=raw,value=latest

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCHAMBER_REF=${{ needs.build.outputs.upstream_ref }}
            OPENCHAMBER_VERSION=${{ needs.build.outputs.version }}
            OPENCODE_VERSION=${{ needs.build.outputs.opencode_version }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

  release:
    name: GitHub Release
    needs: [build, ghcr]
    if: needs.build.result == 'success' && needs.ghcr.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          body: |
            OpenChamber upstream: https://github.com/openchamber/openchamber/releases/tag/${{ needs.build.outputs.upstream_ref }}

            **Bundled opencode-ai version:** ${{ needs.build.outputs.opencode_version }}

            **Runtime environments:**
            - Node.js: v24.19.0
            - Python: 3.13.15
            - Go: 1.25.14
            - Rust: 1.98.0
            - Java: JDK 17
            - Android SDK: cmdline-tools 36.0.2, build-tools 36, platform 36
            - Gradle: 8.11.1

            Published image (linux/amd64 only):
            ghcr.io/${{ github.repository }}:v${{ needs.build.outputs.version }}
