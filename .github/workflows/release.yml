name: Release

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      upstream_ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      upstream_ref:
        description: Upstream release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      upstream_ref: ${{ steps.version.outputs.upstream_ref }}
      opencode_version: ${{ steps.tools.outputs.opencode_version }}
      opencode_package: ${{ steps.tools.outputs.opencode_package }}
      hcloud_version: ${{ steps.image.outputs.hcloud_version }}
      bun_version: ${{ steps.tools.outputs.bun_version }}
      node_version: ${{ steps.tools.outputs.node_version }}
      python_version: ${{ steps.tools.outputs.python_version }}
      go_version: ${{ steps.tools.outputs.go_version }}
      rust_version: ${{ steps.tools.outputs.rust_version }}
      gradle_version: ${{ steps.tools.outputs.gradle_version }}
      gh_version: ${{ steps.tools.outputs.gh_version }}
      tea_version: ${{ steps.tools.outputs.tea_version }}
      android_cmdline_version: ${{ steps.tools.outputs.android_cmdline_version }}
      android_build_tools_version: ${{ steps.tools.outputs.android_build_tools_version }}
      android_platform_version: ${{ steps.tools.outputs.android_platform_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and ancestry
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          UPSTREAM_REF_INPUT: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          version="$VERSION_INPUT"
          if [[ -z "$version" ]]; then
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          upstream_ref="$UPSTREAM_REF_INPUT"
          if [[ -z "$upstream_ref" ]]; then
            upstream_ref="$GITHUB_REF_NAME"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a plain semantic version, got: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          if ! [[ "$upstream_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Upstream ref must be a stable release tag, got: $upstream_ref" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            git fetch origin main --tags --force
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "The release tag must point to a commit on origin/main" >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF_NAME" != "official-stable" ]]; then
              echo "Dispatched releases must build from official-stable" >&2
              exit 1
            fi
            branch_version="$(tr -d '[:space:]' < VERSION)"
            if [[ "$branch_version" != "$version" ]]; then
              echo "VERSION $branch_version does not match requested version $version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream_ref=$upstream_ref" >> "$GITHUB_OUTPUT"

      # One resolver for every bundled toolchain: newest release inside each
      # family (Node 24.x, Python 3.13.x, Go 1.27.x, Gradle 8.x, rust stable,
      # latest gh/tea, the upstream Dockerfile's Bun tag) plus the npm latest
      # OpenCode CLI. Unreachable endpoints fall back to the Dockerfile defaults
      # and warn; a failed OpenCode lookup fails the build instead.
      - name: Resolve toolchain versions
        id: tools
        shell: bash
        env:
          UPSTREAM_REF: ${{ steps.version.outputs.upstream_ref }}
          OPENCHAMBER_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/resolve-toolchain.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: openchamber-release:${{ steps.version.outputs.version }}
          build-args: |
            OPENCHAMBER_REF=${{ steps.version.outputs.upstream_ref }}
            OPENCHAMBER_VERSION=${{ steps.version.outputs.version }}
            OPENCODE_PACKAGE=${{ steps.tools.outputs.opencode_package }}
            OPENCODE_VERSION=${{ steps.tools.outputs.opencode_version }}
            BUN_VERSION=${{ steps.tools.outputs.bun_version }}
            NODE_VERSION=${{ steps.tools.outputs.node_version }}
            PYTHON_VERSION=${{ steps.tools.outputs.python_version }}
            GO_VERSION=${{ steps.tools.outputs.go_version }}
            RUST_VERSION=${{ steps.tools.outputs.rust_version }}
            GRADLE_VERSION=${{ steps.tools.outputs.gradle_version }}
            GH_VERSION=${{ steps.tools.outputs.gh_version }}
            TEA_VERSION=${{ steps.tools.outputs.tea_version }}
            ANDROID_CMDLINE_VERSION=${{ steps.tools.outputs.android_cmdline_version }}
            ANDROID_BUILD_TOOLS_VERSION=${{ steps.tools.outputs.android_build_tools_version }}
            ANDROID_PLATFORM_VERSION=${{ steps.tools.outputs.android_platform_version }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Smoke test release image
        id: image
        shell: bash
        env:
          EXPECTED_NODE: ${{ steps.tools.outputs.node_version }}
          EXPECTED_GO: ${{ steps.tools.outputs.go_version }}
          EXPECTED_GH: ${{ steps.tools.outputs.gh_version }}
        run: |
          set -euo pipefail
          image="openchamber-release:${{ steps.version.outputs.version }}"
          out="$(docker run --rm --platform linux/amd64 --entrypoint sh "${image}" \
            -ceu 'test -f /home/openchamber/openchamber-entrypoint.sh && \
                  test -d /home/openchamber/packages/web/dist && \
                  test -x /usr/local/bin/cloudflared && \
                  command -v hcloud >/dev/null && \
                  test -s /home/openchamber/.hcloud-version && \
                  test -s /home/openchamber/.toolchain-versions && \
                  opencode --version >/dev/null 2>&1 && \
                  echo "bundled opencode runs: ${{ steps.tools.outputs.opencode_package }}@${{ steps.tools.outputs.opencode_version }}" && \
                  echo "bundled toolchain:" && cat /home/openchamber/.toolchain-versions && \
                  echo "bundled KooCLI: hcloud $(cat /home/openchamber/.hcloud-version)"')"
          echo "${out}"
          hcloud="$(printf '%s\n' "${out}" | tail -n1 | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          if [ -z "${hcloud}" ]; then
            echo "Could not read the bundled KooCLI version from the image" >&2
            exit 1
          fi
          echo "hcloud_version=${hcloud}" >> "$GITHUB_OUTPUT"
          echo "Bundled KooCLI: hcloud ${hcloud}"
          node_actual="$(docker run --rm --platform linux/amd64 --entrypoint node "${image}" -v | sed 's/^v//')"
          go_actual="$(docker run --rm --platform linux/amd64 --entrypoint go "${image}" version | awk '{print $3}' | sed 's/^go//')"
          gh_actual="$(docker run --rm --platform linux/amd64 --entrypoint gh "${image}" --version | awk '{print $3}')"
          printf 'node expected=%s actual=%s\ngo expected=%s actual=%s\ngh expected=%s actual=%s\n' \
            "${EXPECTED_NODE}" "${node_actual}" "${EXPECTED_GO}" "${go_actual}" "${EXPECTED_GH}" "${gh_actual}"
          [ "${node_actual}" = "${EXPECTED_NODE}" ] || { echo "node version mismatch" >&2; exit 1; }
          [ "${go_actual}" = "${EXPECTED_GO}" ] || { echo "go version mismatch" >&2; exit 1; }
          [ "${gh_actual}" = "${EXPECTED_GH}" ] || { echo "gh version mismatch" >&2; exit 1; }

  ghcr:
    name: Publish GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,value=v${{ needs.build.outputs.version }},pattern={{version}}
            type=semver,value=v${{ needs.build.outputs.version }},pattern={{major}}.{{minor}}
            type=semver,value=v${{ needs.build.outputs.version }},pattern={{major}}
            type=raw,value=latest

      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCHAMBER_REF=${{ needs.build.outputs.upstream_ref }}
            OPENCHAMBER_VERSION=${{ needs.build.outputs.version }}
            OPENCODE_PACKAGE=${{ needs.build.outputs.opencode_package }}
            OPENCODE_VERSION=${{ needs.build.outputs.opencode_version }}
            BUN_VERSION=${{ needs.build.outputs.bun_version }}
            NODE_VERSION=${{ needs.build.outputs.node_version }}
            PYTHON_VERSION=${{ needs.build.outputs.python_version }}
            GO_VERSION=${{ needs.build.outputs.go_version }}
            RUST_VERSION=${{ needs.build.outputs.rust_version }}
            GRADLE_VERSION=${{ needs.build.outputs.gradle_version }}
            GH_VERSION=${{ needs.build.outputs.gh_version }}
            TEA_VERSION=${{ needs.build.outputs.tea_version }}
            ANDROID_CMDLINE_VERSION=${{ needs.build.outputs.android_cmdline_version }}
            ANDROID_BUILD_TOOLS_VERSION=${{ needs.build.outputs.android_build_tools_version }}
            ANDROID_PLATFORM_VERSION=${{ needs.build.outputs.android_platform_version }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

  release:
    name: GitHub Release
    needs: [build, ghcr]
    if: needs.build.result == 'success' && needs.ghcr.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            OpenChamber upstream: https://github.com/openchamber/openchamber/releases/tag/${{ needs.build.outputs.upstream_ref }}

            ## What's Changed
            * OpenChamber ${{ needs.build.outputs.upstream_ref }} packaged image; see the upstream release notes linked above (maintained by the openchamber project)

            ## Feature
            * Bundled Huawei Cloud KooCLI (`hcloud`) ${{ needs.build.outputs.hcloud_version }} for DNS and other cloud service operations
            * Bundled toolchains now track the newest release inside their family at build time (Node ${{ needs.build.outputs.node_version }}, Go ${{ needs.build.outputs.go_version }}, Gradle ${{ needs.build.outputs.gradle_version }}, gh ${{ needs.build.outputs.gh_version }}, ...), so the image no longer ages between upstream releases
            * OpenCode CLI now tracks the npm `latest` tag (still guarded to 2.x >= 2.0.20) instead of the upstream Dockerfile pin

            ## Bugfix
            * Dropped `generate_release_notes`, which duplicated this body
            * Release notes read the versions the image actually shipped from `/home/openchamber/.toolchain-versions` instead of hardcoded strings
            * Bun base image moved to ${{ needs.build.outputs.bun_version }}, matching the upstream release

            **Bundled OpenCode CLI:** ${{ needs.build.outputs.opencode_package }}@${{ needs.build.outputs.opencode_version }}

            **Runtime environments:**
            - Bun: ${{ needs.build.outputs.bun_version }}
            - Node.js: v${{ needs.build.outputs.node_version }}
            - Python: ${{ needs.build.outputs.python_version }}
            - Go: ${{ needs.build.outputs.go_version }}
            - Rust: ${{ needs.build.outputs.rust_version }}
            - Java: JDK 17 (Temurin)
            - .NET: SDK 8.0
            - Android SDK: cmdline-tools ${{ needs.build.outputs.android_cmdline_version }}, build-tools ${{ needs.build.outputs.android_build_tools_version }}, platform ${{ needs.build.outputs.android_platform_version }} (Android 15 / API 35)
            - Gradle: ${{ needs.build.outputs.gradle_version }}
            - gh: ${{ needs.build.outputs.gh_version }}
            - tea: ${{ needs.build.outputs.tea_version }}
            - Huawei Cloud KooCLI (hcloud): ${{ needs.build.outputs.hcloud_version }}
            <small>hcloud follows Huawei Cloud's `latest` build channel, so this is the version the image actually shipped with; it can change between releases without an OpenChamber bump.</small>

            Published image (linux/amd64 only):
            ghcr.io/${{ github.repository }}:v${{ needs.build.outputs.version }}
