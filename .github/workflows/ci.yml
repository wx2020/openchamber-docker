name: CI

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a plain semantic version, got: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # An invalid workflow file does not fail loudly: GitHub silently stops
      # scheduling it (the daily sync did exactly that when an unknown
      # "workflows" permission scope landed in it). Lint catches it here.
      - name: Lint workflow files
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color -shellcheck=

      # sync merges main into official-stable and pushes with GITHUB_TOKEN,
      # which cannot update .github/workflows; that preflight lives in
      # sync-upstream.yml so a stale workflow file fails there with a clear
      # message instead of an opaque remote rejection.

      - name: Validate Compose file
        env:
          OPENCHAMBER_UI_PASSWORD: ci-only-not-a-secret
        run: docker compose -f docker-compose.yml config --quiet

      # Resolves every bundled toolchain to the newest release inside its family
      # (Node 24.x, Python 3.13.x, Gradle 8.x, latest gh/tea, current rust
      # stable, the Bun tag the upstream Dockerfile pins) plus the OpenCode CLI
      # from the npm latest tag. The Dockerfile defaults are the local fallback.
      - name: Resolve toolchain versions
        id: tools
        shell: bash
        env:
          UPSTREAM_REF: v${{ steps.version.outputs.version }}
          OPENCHAMBER_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/resolve-toolchain.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: openchamber-ci:${{ steps.version.outputs.version }}
          build-args: |
            OPENCHAMBER_REF=v${{ steps.version.outputs.version }}
            OPENCHAMBER_VERSION=${{ steps.version.outputs.version }}
            OPENCODE_PACKAGE=${{ steps.tools.outputs.opencode_package }}
            OPENCODE_VERSION=${{ steps.tools.outputs.opencode_version }}
            BUN_VERSION=${{ steps.tools.outputs.bun_version }}
            NODE_VERSION=${{ steps.tools.outputs.node_version }}
            PYTHON_VERSION=${{ steps.tools.outputs.python_version }}
            GO_VERSION=${{ steps.tools.outputs.go_version }}
            RUST_VERSION=${{ steps.tools.outputs.rust_version }}
            GRADLE_VERSION=${{ steps.tools.outputs.gradle_version }}
            GH_VERSION=${{ steps.tools.outputs.gh_version }}
            TEA_VERSION=${{ steps.tools.outputs.tea_version }}
            ANDROID_CMDLINE_VERSION=${{ steps.tools.outputs.android_cmdline_version }}
            ANDROID_BUILD_TOOLS_VERSION=${{ steps.tools.outputs.android_build_tools_version }}
            ANDROID_PLATFORM_VERSION=${{ steps.tools.outputs.android_platform_version }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

      # hcloud follows the upstream /cli/latest/ build, so the image reports the
      # version it actually shipped; nothing to pin here.
      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint sh \
            "openchamber-ci:${{ steps.version.outputs.version }}" \
            -ceu 'test -f /home/openchamber/openchamber-entrypoint.sh && \
                  test -d /home/openchamber/packages/web/dist && \
                  test -x /usr/local/bin/cloudflared && \
                  command -v dotnet >/dev/null && \
                  command -v java >/dev/null && \
                  command -v cargo >/dev/null && \
                  command -v go >/dev/null && \
                  command -v hcloud >/dev/null && \
                  test -s /home/openchamber/.hcloud-version && \
                  test -s /home/openchamber/.toolchain-versions && \
                  opencode --version >/dev/null 2>&1 && \
                  echo "bundled opencode runs: ${{ steps.tools.outputs.opencode_package }}@${{ steps.tools.outputs.opencode_version }}" && \
                  echo "bundled toolchain:" && cat /home/openchamber/.toolchain-versions && \
                  echo "bundled KooCLI: hcloud $(cat /home/openchamber/.hcloud-version)"'

      # The image reports what it actually installed; compare it with the
      # resolved values so a silently ignored build arg cannot slip through.
      - name: Verify bundled versions match the resolution
        shell: bash
        env:
          EXPECTED_NODE: ${{ steps.tools.outputs.node_version }}
          EXPECTED_GO: ${{ steps.tools.outputs.go_version }}
          EXPECTED_GH: ${{ steps.tools.outputs.gh_version }}
        run: |
          set -euo pipefail
          image="openchamber-ci:${{ steps.version.outputs.version }}"
          node_actual="$(docker run --rm --platform linux/amd64 --entrypoint node "$image" -v | sed 's/^v//')"
          go_actual="$(docker run --rm --platform linux/amd64 --entrypoint go "$image" version | awk '{print $3}' | sed 's/^go//')"
          gh_actual="$(docker run --rm --platform linux/amd64 --entrypoint gh "$image" --version | awk '{print $3}')"
          printf 'node expected=%s actual=%s\ngo expected=%s actual=%s\ngh expected=%s actual=%s\n' \
            "${EXPECTED_NODE}" "${node_actual}" "${EXPECTED_GO}" "${go_actual}" "${EXPECTED_GH}" "${gh_actual}"
          [ "${node_actual}" = "${EXPECTED_NODE}" ] || { echo "node version mismatch" >&2; exit 1; }
          [ "${go_actual}" = "${EXPECTED_GO}" ] || { echo "go version mismatch" >&2; exit 1; }
          [ "${gh_actual}" = "${EXPECTED_GH}" ] || { echo "gh version mismatch" >&2; exit 1; }

  release:
    name: release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
