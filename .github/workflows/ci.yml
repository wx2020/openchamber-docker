name: CI

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a plain semantic version, got: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate Compose file
        env:
          OPENCHAMBER_UI_PASSWORD: ci-only-not-a-secret
        run: docker compose -f docker-compose.yml config --quiet

      - name: Resolve OpenCode CLI package and version
        id: opencode
        shell: bash
        env:
          OPENCHAMBER_VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM_REF: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          oc_major="${OPENCHAMBER_VERSION%%.*}"
          if [ "${oc_major}" -ge 2 ]; then pkg="@opencode/cli"; else pkg="opencode-ai"; fi
          # Trust the upstream Dockerfile pin when present so the bundled server
          # matches the @opencode/client the image is built from.
          pin="$(curl -fsSL "https://raw.githubusercontent.com/openchamber/openchamber/${UPSTREAM_REF}/Dockerfile" \
            | grep -Eo '@opencode/cli@[0-9][0-9A-Za-z.+-]*' | head -n1 | cut -d@ -f3 || true)"
          if [ "${pkg}" = "@opencode/cli" ] && [ -n "${pin}" ]; then
            ver="${pin}"
          else
            ver="$(npm show "${pkg}" version)"
          fi
          npm show "${pkg}@${ver}" version >/dev/null
          if [ "${oc_major}" -ge 2 ]; then
            # Upstream floor: MINIMUM_OPENCODE_VERSION in openchamber/openchamber
            # packages/web/server/lib/opencode/compatibility.js; major must stay 2.
            if [ "${ver%%.*}" != "2" ] || \
               [ "$(printf '2.0.20\n%s\n' "${ver}" | sort -V | head -n1)" != "2.0.20" ]; then
              echo "OpenChamber ${OPENCHAMBER_VERSION} requires OpenCode 2.x >= 2.0.20, resolved ${pkg}@${ver}" >&2
              exit 1
            fi
          fi
          echo "package=${pkg}" >> "$GITHUB_OUTPUT"
          echo "opencode_version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Resolved OpenCode CLI: ${pkg}@${ver} for OpenChamber ${OPENCHAMBER_VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: openchamber-ci:${{ steps.version.outputs.version }}
          build-args: |
            OPENCHAMBER_REF=v${{ steps.version.outputs.version }}
            OPENCHAMBER_VERSION=${{ steps.version.outputs.version }}
            OPENCODE_PACKAGE=${{ steps.opencode.outputs.package }}
            OPENCODE_VERSION=${{ steps.opencode.outputs.opencode_version }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint sh \
            "openchamber-ci:${{ steps.version.outputs.version }}" \
            -ceu 'test -f /home/openchamber/openchamber-entrypoint.sh && \
                  test -d /home/openchamber/packages/web/dist && \
                  test -x /usr/local/bin/cloudflared && \
                  command -v dotnet >/dev/null && \
                  command -v java >/dev/null && \
                  command -v cargo >/dev/null && \
                  command -v go >/dev/null && \
                  echo "diag: $(command -v opencode) | $(ls -l "$(command -v opencode)" 2>&1 | head -1)" && \
                  echo "diag-rc: $(timeout 15 opencode --version; echo rc=$?)" && \
                  raw="$(timeout 15 opencode --version 2>/dev/null || true)" && \
                  installed="$(printf "%s" "${raw}" | tr -d "\r" | sed -E "s/^opencode[[:space:]]+v?//" | grep -Eo "[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?" | head -n1)" && \
                  echo "bundled opencode: ${installed} (raw: ${raw})" && \
                  test -n "${installed}" && \
                  test "${installed}" = "${{ steps.opencode.outputs.opencode_version }}"'

  release:
    name: release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
